
security.jwt.secret=MySuperStrongJWTSecretKeyForEcommerceApp123456
security.jwt.expiration-ms=86400000

logging.level.org.springframework.web=TRACE
spring.application.name=payment-service
server.port=8099

# Eureka client configs
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Prefer IP over hostname
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=root
spring.datasource.password=nithin123
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/paymentdb
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.cloud.loadbalancer.retry.enabled=true


# Kafka bootstrap
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Add type headers so consumers know the class type
spring.kafka.producer.properties.spring.json.add.type.headers=true

management.endpoints.web.exposure.include=prometheus,metrics,info,health,shutdown,beans

# Health endpoint details
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Enable shutdown
management.endpoint.shutdown.enabled=true

# Info endpoint env
management.info.env.enabled=true
